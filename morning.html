  <style>
    :root{

      --text:#193b35;

    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{

      background:var(--bg);
      color:var(--text);
      font-family:Tahoma, Arial, sans-serif;
      line-height:2;
    }

    header{

      padding:12px 16px;
      display:flex;

    }

      color:var(--green-dark);

      font-weight:800;

      flex-wrap:wrap;

      color:var(--text);
      padding:6px 10px;

      font-size:14px;
    }

    .links a:hover{
      background:var(--green-soft);
      color:var(--green-dark);
    }

    main{
      max-width:900px;
      margin:auto;
      padding:28px 14px 60px;

      text-align:center;
      margin-bottom:22px;
    }

      font-size:32px;
    }

    .hero p{
      margin:0;
      color:var(--muted);
    }

      justify-content:center;
      margin:18px 0 24px;
    }

    .reset-all{
      border:0;
      background:var(--green);
      color:#fff;
      border-radius:14px;
      padding:11px 18px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 5px 15px rgba(21,155,134,.18);
    }

    .reset-all:active{transform:scale(.98)}

    .dhikr-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      margin:14px 0;
      padding:20px;
      box-shadow:var(--shadow);
      transition:.2s ease;
    }

    .dhikr-card.done{
      border-color:#8dd7c5;
      background:#fbfffd;
    }

    .number{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:42px;
      height:30px;
      padding:0 9px;
      border-radius:999px;
      background:var(--green-soft);
      color:var(--green-dark);
      font-size:13px;
      font-weight:800;
      margin-bottom:9px;
    }

    .text{
      font-size:21px;
      font-weight:600;
      line-height:2.25;
      white-space:pre-line;
    }

    .note{
      color:var(--muted);
      font-size:14px;
      margin-top:8px;
      line-height:1.8;
    }

    .counter-row{
      margin-top:18px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:center;
    }

    .counter-btn{
      border:0;
      width:100%;
      min-height:60px;
      border-radius:17px;
      background:var(--green);
      color:#fff;
      cursor:pointer;
      font-size:20px;
      font-weight:800;
      box-shadow:0 6px 15px rgba(21,155,134,.16);
      transition:.15s ease;
      touch-action:manipulation;
    }

    .counter-btn:active{
      transform:scale(.97);
    }

    .counter-btn.done-btn{
      background:var(--green-dark);
    }

    .counter-display{
      min-width:94px;
      text-align:center;
      font-weight:800;
      color:var(--green-dark);
      font-size:18px;
    }

    .counter-display .current{
      font-size:25px;
    }

    .footer{
      text-align:center;
      color:var(--muted);
      margin-top:35px;
      font-size:13px;
    }

    @media (max-width:650px){
      .nav{align-items:flex-start; flex-direction:column}
      .links{width:100%}
      .hero h1{font-size:27px}
      .dhikr-card{padding:16px; border-radius:18px}
      .text{font-size:18px; line-height:2.15}
    }
  </style>
</head>

  },
  {
    text:`اللَّهُمَّ أَنْتَ رَبِّي لا إِلَهَ إِلا أَنْتَ، عَلَيْكَ تَوَكَّلْتُ، وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ، مَا شَاءَ اللَّهُ كَانَ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ، وَلا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا، إِنَّ رَبِّي عَلَى صِرَاطٍ مُسْتَقِيمٍ.`,
    count:1
  },
  {
    text:`لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءِ قَدِيرِ.`,
    count:100
  },
  {
    text:`سُبْحـانَ اللهِ وَبِحَمْـدِهِ.`,
    count:100
  },
  {
    text:`أسْتَغْفِرُ اللهَ وَأتُوبُ إلَيْهِ`,
    count:100
  }
];

const list = document.getElementById("adhkarList");
const resetAll = document.getElementById("resetAll");
const progress = new Array(adhkar.length).fill(0);

let audioContext = null;

function playClick(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;

    if(!audioContext) audioContext = new AC();

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(620, audioContext.currentTime);

    gain.gain.setValueAtTime(0.035, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.07
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.07);
  }catch(e){}
}

function render(){
  list.innerHTML = "";

  adhkar.forEach((item,index)=>{
    const card = document.createElement("article");
    card.className = "dhikr-card";
    card.id = `dhikr-${index+1}`;

    const done = progress[index] >= item.count;

    card.innerHTML = `
      <div class="number">الذكر ${index+1}</div>
      <div class="text">${item.text}</div>
      ${item.note ? `<div class="note">${item.note}</div>` : ""}
      <div class="counter-row">
        <button class="counter-btn ${done ? "done-btn" : ""}" aria-label="تسبيح الذكر ${index+1}">
          ${done ? "✓ تم الذكر" : "اضغط للتكرار"}
        </button>
        <div class="counter-display" aria-live="polite">
          <span class="current">${done ? "✓" : progress[index]}</span>
          <span> / ${item.count}</span>
        </div>
      </div>
    `;

    const button = card.querySelector(".counter-btn");

    button.addEventListener("click", ()=>{
      if(progress[index] >= item.count) return;

      playClick();
      progress[index]++;

      if(progress[index] >= item.count){
        progress[index] = item.count;
      }

      render();
    });

    list.appendChild(card);
  });
}

resetAll.addEventListener("click", ()=>{
  progress.fill(0);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
});

render();
</script>

</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d5c4b">

<title>أذكار الصباح — ذِكر</title>

<style>
:root{
  --bg:#f8f7f2;
  --card:#fffdf9;
  --text:#173f37;
  --muted:#6b7b76;
  --green:#0d5c4b;
  --green2:#174f43;
  --line:#e4e6df;
  --soft:#e8f2ec;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
}

button{
  font:inherit;
}

.nav{
  height:74px;
  background:#fffdf9;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:25px;
  padding:0 5%;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:25px;
  margin-left:auto;
  color:var(--text);
  text-decoration:none;
}

.brand-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:22px;
}

.nav a{
  color:var(--text);
  text-decoration:none;
}

.container{
  max-width:900px;
  margin:auto;
  padding:45px 18px 70px;
}

.hero-title{
  text-align:center;
  margin-bottom:35px;
}

.hero-title .sun{
  font-size:48px;
  margin-bottom:5px;
}

.hero-title h1{
  margin:0;
  font-size:34px;
}

.hero-title p{
  color:var(--muted);
  margin-top:10px;
}

.dhikr{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:28px 24px;
  margin-bottom:18px;
  box-shadow:0 7px 25px rgba(22,58,50,.06);
  transition:.2s;
}

.dhikr.completed{
  border-color:#8bbda8;
  background:#f5fbf7;
}

.dhikr-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:34px;
  height:34px;
  padding:0 10px;
  border-radius:50%;
  background:var(--soft);
  color:var(--green);
  font-weight:bold;
  margin-bottom:15px;
}

.dhikr-text{
  font-size:21px;
  line-height:2.15;
  text-align:center;
  margin:5px 0 22px;
}

.source{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:18px;
}

.counter-area{
  text-align:center;
}

.counter-btn{
  width:82px;
  height:82px;
  border:0;
  border-radius:50%;
  background:linear-gradient(145deg,#0d6b57,#174f43);
  color:white;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(13,92,75,.22);
  transition:transform .12s ease,box-shadow .2s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.counter-btn:active{
  transform:scale(.90);
  box-shadow:0 3px 10px rgba(13,92,75,.18);
}

.counter-number{
  font-size:24px;
  font-weight:800;
}

.counter-total{
  font-size:12px;
  opacity:.8;
}

.counter-btn.done{
  background:#4d8b68;
}

.counter-label{
  margin-top:9px;
  font-size:13px;
  color:var(--muted);
}

.reset{
  display:block;
  margin:35px auto 0;
  border:1px solid var(--line);
  background:transparent;
  color:var(--green);
  border-radius:25px;
  padding:10px 20px;
  cursor:pointer;
}

.footer{
  background:#123f35;
  color:#e9f2ee;
  text-align:center;
  padding:30px 20px;
}

@media(max-width:600px){
  .nav{
    height:64px;
    padding:0 15px;
  }

  .nav .brand{
    margin:auto;
  }

  .container{
    padding:30px 12px 60px;
  }

  .hero-title h1{
    font-size:28px;
  }

  .dhikr{
    padding:23px 17px;
  }

  .dhikr-text{
    font-size:18px;
    line-height:2.05;
  }
}
</style>
</head>

<body>

<header class="nav">
  <a class="brand" href="index.html">
    <span class="brand-icon">ذ</span>
    <span>ذِكر</span>
  </a>
</header>

<main class="container">

  <section class="hero-title">
    <div class="sun">☀️</div>
    <h1>أذكار الصباح</h1>
    <p>ابدأ يومك بذكر الله</p>
  </section>

  <section id="adhkar"></section>

  <button class="reset" id="resetAll">
    إعادة جميع العدادات
  </button>

</main>

<footer class="footer">
  <strong>ذِكر</strong>
  <div>اذكر الله في كل وقت.</div>
</footer>

const container = document.getElementById("adhkar");

function playClick(){

  try{

    const AudioContext =
      window.AudioContext || window.webkitAudioContext;

    if(!AudioContext) return;

    const audio = new AudioContext();

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 620;

    gain.gain.setValueAtTime(
      0.035,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.07
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.07
    );

  }catch(e){}

}

function createDhikr(item,index){

  const card = document.createElement("article");

  card.className = "dhikr";

  card.innerHTML = `
    <div class="dhikr-number">${index + 1}</div>

    <div class="dhikr-text">${item.text}</div>

    <div class="source">${item.source} — ${item.count} ${item.count === 1 ? "مرة" : "مرات"}</div>

    <div class="counter-area">

      <button
        class="counter-btn"
        type="button"
        aria-label="تكرار الذكر"
      >
        <span class="counter-number">0</span>
        <span class="counter-total">/${item.count}</span>
      </button>

      <div class="counter-label">
        اضغط للتكرار
      </div>

    </div>
  `;

  const button =
    card.querySelector(".counter-btn");

  const number =
    card.querySelector(".counter-number");

  const label =
    card.querySelector(".counter-label");

  let current = 0;

  button.addEventListener("click",()=>{

    if(current >= item.count) return;

    current++;

    number.textContent = current;

    playClick();

    if(current >= item.count){

      button.classList.add("done");

      label.textContent = "تم الذكر ✓";

      card.classList.add("completed");

    }

  });

  return card;
}

adhkar.forEach((item,index)=>{
  container.appendChild(
    createDhikr(item,index)
  );
});

document
.getElementById("resetAll")
.addEventListener("click",()=>{

  document
  .querySelectorAll(".dhikr")
  .forEach(card=>{

    card.classList.remove("completed");

    const button =
      card.querySelector(".counter-btn");

    const number =
      card.querySelector(".counter-number");

    const label =
      card.querySelector(".counter-label");

    button.classList.remove("done");

    number.textContent = "0";

    label.textContent = "اضغط للتكرار";

  });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسبيح | ذِكر</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f7f3e8;
  color: #183c2c;
}

header {
  background: #174c36;
  color: white;
  text-align: center;
  padding: 22px 15px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

header p {
  margin: 0;
  color: #dcebe2;
}

nav {
  background: white;
  border-bottom: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}

nav a {
  display: inline-block;
  color: #174c36;
  text-decoration: none;
  margin: 4px 7px;
  font-weight: bold;
}

.container {
  max-width: 850px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 25px 15px;
  box-shadow: 0 5px 18px rgba(0,0,0,.06);
  text-align: center;
}

/* اسم الذكر */
.zikr-name {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 18px;
}

/* المسبحة */
.tasbih {
  position: relative;
  width: min(340px, 85vw);
  aspect-ratio: 1;
  margin: 0 auto 20px;
  cursor: pointer;
  user-select: none;
}

.ring {
  position: absolute;
  inset: 18px;
  border: 6px solid #d7c99d;
  border-radius: 50%;
  box-shadow:
    inset 0 0 0 8px #eee5cf,
    0 4px 12px rgba(0,0,0,.08);
}

/* الخرز */
.bead {
  position: absolute;
  width: 35px;
  height: 35px;
  border-radius: 50%;

  background: linear-gradient(
    145deg,
    #2f7d59,
    #124b37
  );

  border: 3px solid #d8bd76;

  box-shadow:
    0 4px 8px rgba(0,0,0,.18);

  transform: translate(-50%, -50%);

  transition:
    transform .2s ease,
    filter .2s ease;
}

.bead.active {
  transform:
    translate(-50%, -50%)
    scale(1.25);

  filter: brightness(1.3);
}

/* المنتصف */
.center {
  position: absolute;
  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: 115px;
  height: 115px;

  border-radius: 50%;

  background: #fffdf7;

  border: 2px solid #d8c99f;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.number {
  font-size: 34px;
  font-weight: bold;
  color: #174c36;
}

.total {
  font-size: 13px;
  color: #6d7972;
  margin-top: 3px;
}

/* الأزرار */
.buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.tasbih-btn {
  border: 0;
  border-radius: 15px;

  background: #174c36;
  color: white;

  padding: 14px 40px;

  font-family: inherit;
  font-size: 18px;
  font-weight: bold;

  cursor: pointer;

  min-width: 180px;
}

.tasbih-btn:active {
  transform: scale(.96);
}

.reset-btn {
  border: 1px solid #cfc6b3;
  border-radius: 15px;

  background: white;
  color: #174c36;

  padding: 13px 25px;

  font-family: inherit;
  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

.status {
  margin-top: 15px;
  color: #68766e;
  font-size: 14px;
}

.done {
  color: #247b43;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 30px;
  color: #6b776f;
}

@media (max-width: 600px) {

  header h1 {
    font-size: 24px;
  }

  nav a {
    font-size: 14px;
  }

  .bead {
    width: 31px;
    height: 31px;
  }

  .center {
    width: 105px;
    height: 105px;
  }
}
</style>
</head>

<body>

<header>
  <h1>التسبيح</h1>
  <p>ذِكر — اذكر الله في كل وقت.</p>
</header>

<nav>
  <a href="index.html">الرئيسية</a>
  <a href="morning.html">أذكار الصباح</a>
  <a href="evening.html">أذكار المساء</a>
  <a href="sleep.html">أذكار النوم</a>
  <a href="tasbih.html">التسبيح</a>
</nav>

<main class="container">

  <section class="card">

    <div class="zikr-name">
      سبحان الله
    </div>

    <div class="tasbih" id="tasbih">

      <div class="ring"></div>

      <div class="center">
        <div>
          <div class="number" id="number">0</div>
          <div class="total">من 33</div>
        </div>
      </div>

    </div>

    <div class="buttons">

      <button
        class="tasbih-btn"
        id="tasbihButton"
        type="button">
        تسبيح
      </button>

      <button
        class="reset-btn"
        id="resetButton"
        type="button">
        إعادة
      </button>

    </div>

    <div
      class="status"
      id="status"
      aria-live="polite">
      0 / 33
    </div>

  </section>

</main>

<footer>
  ذِكر — اذكر الله في كل وقت.
</footer>

<script>

const tasbih = document.getElementById("tasbih");
const button = document.getElementById("tasbihButton");
const resetButton = document.getElementById("resetButton");

const number = document.getElementById("number");
const status = document.getElementById("status");

let count = 0;
const total = 33;

/* إنشاء الخرز */

const beadsCount = 24;

for (let i = 0; i < beadsCount; i++) {

  const bead = document.createElement("div");

  bead.className = "bead";

  const angle =
    (i / beadsCount) *
    Math.PI *
    2 -
    Math.PI / 2;

  const x =
    50 +
    42 *
    Math.cos(angle);

  const y =
    50 +
    42 *
    Math.sin(angle);

  bead.style.left = x + "%";
  bead.style.top = y + "%";

  tasbih.appendChild(bead);
}

const beads =
  document.querySelectorAll(".bead");


/* صوت النقرة */

function clickSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.frequency.value = 520;

    gain.gain.value = 0.035;

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.045
    );

  } catch (error) {}

}


/* تحديث الشكل */

function update() {

  number.textContent = count;

  status.textContent =
    count + " / " + total;

  beads.forEach((bead, index) => {

    bead.classList.remove("active");

    if (
      count > 0 &&
      index === ((count - 1) % beadsCount)
    ) {

      bead.classList.add("active");

    }

  });

  if (count >= total) {

    status.textContent = "تم التسبيح ✓";

    status.classList.add("done");

    button.textContent = "تم ✓";

  } else {

    status.classList.remove("done");

    button.textContent = "تسبيح";

  }

}


/* التسبيح */

function doTasbih() {

  if (count >= total) {
    return;
  }

  count++;

  clickSound();

  update();

}


/* الضغط على الزر */

button.addEventListener(
  "click",
  doTasbih
);


/* الضغط على المسبحة نفسها */

tasbih.addEventListener(
  "click",
  doTasbih
);


/* إعادة */

resetButton.addEventListener(
  "click",
  function() {

    count = 0;

    update();

  }
);


/* تشغيل أولي */

update();

</script>

</body>
</html>

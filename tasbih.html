<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التسبيح | ذِكر</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f7f3e8;
  color: #174c36;
}

/* الهيدر */
header {
  background: #174c36;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 8px 0 0;
  font-size: 16px;
  opacity: .9;
}

/* القائمة */
nav {
  background: white;
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
  padding: 16px 10px;
  border-bottom: 1px solid #eee;
}

nav a {
  color: #174c36;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
}

/* المحتوى */
.container {
  max-width: 1000px;
  margin: 30px auto;
  padding: 0 15px;
}

/* بطاقة المسبحة */
.tasbih-box {
  background: white;
  border-radius: 24px;
  padding: 30px 20px;
  box-shadow: 0 8px 30px rgba(30,70,50,.08);
  text-align: center;
}

.tasbih-title {
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 25px;
}

/* المسبحة */
.beads {
  width: 300px;
  height: 300px;
  margin: 0 auto 25px;
  border-radius: 50%;
  position: relative;
}

/* الحبات */
.bead {
  position: absolute;
  width: 34px;
  height: 34px;
  background: #176043;
  border: 3px solid #d7bd70;
  border-radius: 50%;
  box-shadow: 0 3px 7px rgba(0,0,0,.15);
}

/* العداد */
.center-counter {
  position: absolute;
  width: 135px;
  height: 135px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #fffdf7;
  border: 2px solid #ddd2ad;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.center-counter .number {
  font-size: 40px;
  font-weight: bold;
  color: #174c36;
}

.center-counter .small {
  font-size: 14px;
  color: #777;
}

/* زر العد */
.count-button {
  border: 0;
  background: #176043;
  color: white;
  border-radius: 16px;
  padding: 15px 35px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 25px;
  min-width: 220px;
}

.count-button:active {
  transform: scale(.97);
}

.count-button.done {
  background: #287a58;
}

/* عبارة الذكر */
.phrase {
  background: #f1f7f2;
  border-radius: 20px;
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 25px;
}

/* أزرار الأذكار */
.dhikr-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 20px;
}

.dhikr-card {
  border: 1px solid #dfe8df;
  border-radius: 18px;
  padding: 20px 12px;
  background: #fbfdfb;
  cursor: pointer;
  transition: .2s;
}

.dhikr-card:hover {
  transform: translateY(-3px);
}

.dhikr-card.active {
  background: #176043;
  color: white;
}

.dhikr-name {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.dhikr-count {
  font-size: 16px;
}

/* زر إعادة */
.reset {
  margin-top: 25px;
  background: white;
  color: #174c36;
  border: 1px solid #cfc7ad;
  border-radius: 13px;
  padding: 12px 25px;
  font-size: 17px;
  cursor: pointer;
}

/* الموبايل */
@media(max-width:700px) {

  header h1 {
    font-size: 26px;
  }

  nav {
    gap: 14px;
  }

  nav a {
    font-size: 14px;
  }

  .beads {
    width: 270px;
    height: 270px;
  }

  .bead {
    width: 30px;
    height: 30px;
  }

  .dhikr-list {
    grid-template-columns: 1fr;
  }

  .tasbih-title {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<header>
  <h1>التسبيح</h1>
  <p>سبّح واذكر الله</p>
</header>

<nav>
  <a href="index.html">الرئيسية</a>
  <a href="morning.html">أذكار الصباح</a>
  <a href="evening.html">أذكار المساء</a>
  <a href="sleep.html">أذكار النوم</a>
  <a href="tasbih.html">التسبيح</a>
</nav>

<main class="container">

<div class="tasbih-box">

  <div class="tasbih-title" id="title">
    سبحان الله
  </div>

  <div class="beads" id="beads">

    <div class="center-counter">
      <div class="number" id="counter">0</div>
      <div class="small" id="targetText">من 33</div>
    </div>

  </div>

  <div class="phrase" id="phrase">
    سبحان الله
  </div>

  <button class="count-button" id="countButton" onclick="countDhikr()">
    اضغط للتسبيح
  </button>

  <div class="dhikr-list">

    <div class="dhikr-card active" onclick="selectDhikr(0)">
      <div class="dhikr-name">سبحان الله</div>
      <div class="dhikr-count" id="count0">0 / 33</div>
    </div>

    <div class="dhikr-card" onclick="selectDhikr(1)">
      <div class="dhikr-name">الحمد لله</div>
      <div class="dhikr-count" id="count1">0 / 33</div>
    </div>

    <div class="dhikr-card" onclick="selectDhikr(2)">
      <div class="dhikr-name">الله أكبر</div>
      <div class="dhikr-count" id="count2">0 / 34</div>
    </div>

    <div class="dhikr-card" onclick="selectDhikr(3)">
      <div class="dhikr-name">أستغفر الله</div>
      <div class="dhikr-count" id="count3">0 / 33</div>
    </div>

    <div class="dhikr-card" onclick="selectDhikr(4)">
      <div class="dhikr-name">لا إله إلا الله</div>
      <div class="dhikr-count" id="count4">0 / 33</div>
    </div>

    <div class="dhikr-card" onclick="selectDhikr(5)">
      <div class="dhikr-name">لا حول ولا قوة إلا بالله</div>
      <div class="dhikr-count" id="count5">0 / 33</div>
    </div>

  </div>

  <button class="reset" onclick="resetAll()">
    ↻ إعادة العدادات
  </button>

</div>

</main>

<script>

/* الأذكار */
const dhikr = [
  {
    name: "سبحان الله",
    target: 33
  },
  {
    name: "الحمد لله",
    target: 33
  },
  {
    name: "الله أكبر",
    target: 34
  },
  {
    name: "أستغفر الله",
    target: 33
  },
  {
    name: "لا إله إلا الله",
    target: 33
  },
  {
    name: "لا حول ولا قوة إلا بالله",
    target: 33
  }
];

/* العدادات */
let counts = [0, 0, 0, 0, 0, 0];

let current = 0;

/* إنشاء 33 حبة */
function createBeads() {

  const container = document.getElementById("beads");

  const oldBeads = container.querySelectorAll(".bead");

  oldBeads.forEach(bead => bead.remove());

  const total = 33;

  const radius = 128;

  for(let i = 0; i < total; i++) {

    const bead = document.createElement("div");

    bead.className = "bead";

    const angle = (i / total) * Math.PI * 2 - Math.PI / 2;

    const x =
      150 +
      Math.cos(angle) * radius -
      17;

    const y =
      150 +
      Math.sin(angle) * radius -
      17;

    bead.style.left = x + "px";
    bead.style.top = y + "px";

    container.appendChild(bead);
  }

}

/* صوت خفيف */
let audioContext;

function clickSound() {

  try {

    audioContext =
      audioContext ||
      new (window.AudioContext ||
      window.webkitAudioContext)();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.frequency.value = 520;

    gain.gain.value = 0.035;

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.05
    );

  } catch(e) {}

}

/* اختيار ذكر */
function selectDhikr(index) {

  current = index;

  document.getElementById("title").textContent =
    dhikr[index].name;

  document.getElementById("phrase").textContent =
    dhikr[index].name;

  document.getElementById("targetText").textContent =
    "من " + dhikr[index].target;

  update();

}

/* العد */
function countDhikr() {

  if(counts[current] >= dhikr[current].target) {
    return;
  }

  counts[current]++;

  clickSound();

  update();

}

/* تحديث الصفحة */
function update() {

  const number =
    document.getElementById("counter");

  number.textContent =
    counts[current];

  document.getElementById("targetText").textContent =
    "من " + dhikr[current].target;

  const button =
    document.getElementById("countButton");

  if(
    counts[current] >=
    dhikr[current].target
  ) {

    button.textContent =
      "✓ اكتمل";

    button.classList.add("done");

  } else {

    button.textContent =
      "اضغط للتسبيح";

    button.classList.remove("done");

  }

  /* تحديث الكروت */
  for(let i = 0; i < dhikr.length; i++) {

    document.getElementById("count" + i).textContent =
      counts[i] + " / " + dhikr[i].target;

  }

  /* تحديد الكارت الحالي */
  const cards =
    document.querySelectorAll(".dhikr-card");

  cards.forEach((card, i) => {

    card.classList.toggle(
      "active",
      i === current
    );

  });

  /* تحديث الحبات */
  const beads =
    document.querySelectorAll(".bead");

  beads.forEach((bead, i) => {

    if(i < counts[current]) {

      bead.style.background =
        "#d7bd70";

    } else {

      bead.style.background =
        "#176043";

    }

  });

}

/* إعادة */
function resetAll() {

  counts =
    [0, 0, 0, 0, 0, 0];

  update();

}

/* تشغيل */
createBeads();

update();

</script>

</body>
</html>

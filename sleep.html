<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار النوم والأحلام | ذِكر</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f3e8;color:#183c2c}header{background:#174c36;color:#fff;padding:22px 16px;text-align:center}header h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:#dcebe2}nav{background:#fff;border-bottom:1px solid #ddd;padding:10px;text-align:center;position:sticky;top:0;z-index:10}nav a{display:inline-block;color:#174c36;text-decoration:none;margin:4px 7px;font-weight:bold}.container{max-width:900px;margin:25px auto;padding:0 15px}.actions{text-align:center;margin-bottom:20px}button{font-family:inherit}.reset{background:#174c36;color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;font-size:16px}.card{background:#fff;border:1px solid #e4dfd2;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 4px 14px rgba(0,0,0,.05)}.num{display:inline-block;background:#174c36;color:#fff;border-radius:50%;width:34px;height:34px;line-height:34px;text-align:center;margin-left:8px}.card h2{font-size:19px;line-height:1.8;margin:0 0 12px}.text{font-size:20px;line-height:2.2;white-space:pre-line}.count{margin-top:18px;text-align:center}.counter{font-size:18px;font-weight:bold;color:#174c36;margin-bottom:10px}.zikr-btn{background:#2f7d57;color:#fff;border:0;border-radius:14px;padding:13px 28px;font-size:18px;cursor:pointer;min-width:150px}.zikr-btn:disabled{background:#9aa9a1;cursor:default}footer{text-align:center;padding:30px;color:#6b776f}@media(max-width:600px){header h1{font-size:23px}.card{padding:17px}.text{font-size:18px}nav a{font-size:14px}}
</style>
</head>
<body>
<header><h1>أذكار النوم والأحلام</h1><p>ذِكر — اذكر الله في كل وقت.</p></header>
<nav><a href="index.html">الرئيسية</a><a href="morning.html">أذكار الصباح</a><a href="evening.html">أذكار المساء</a><a href="sleep.html">أذكار النوم</a><a href="tasbih.html">التسبيح</a></nav>
<main class="container"><div class="actions"><button class="reset" onclick="resetAll()">إعادة جميع العدادات</button></div><div id="cards"></div></main>
<footer>ذِكر — اذكر الله في كل وقت.</footer>
<script>
const adhkar=[
{text:"باسمك ربـي وضعت جنـبي، وبك أرفعـه، فإن أمسـكت نفسـي فارحـمها، وإن أرسلتـها فاحفظـها بمـا تحفـظ به عبـادك الصـالحـين.",count:1},
{text:"اللهـم إنـك خلقت نفسـي وأنـت توفـاهـا لك ممَـاتـها ومحـياها، إن أحييـتها فاحفظـها، وإن أمتـها فاغـفر لـها. اللهـم إنـي أسـألـك العـافـية.",count:1},
{text:"اللهـم قنـي عذابـك يـوم تبـعث عبـادك.",count:3},
{text:"باسـمك اللهـم أمـوت وأحـيا.",count:1},
{text:"الـحمد لله الذي أطـعمنا وسقـانا، وكفـانا، وآوانا، فكـم ممـن لا كـافي لـه ولا مـؤوي.",count:1},
{text:"اللهـم عالـم الغـيب والشـهادة فاطـر السماوات والأرض رب كـل شـيء ومليـكه، أشهـد أن لا إلـه إلا أنت، أعـوذ بك من شـر نفسـي، ومن شـر الشيـطان وشـركه، وأن أقتـرف علـى نفسـي سوءا أو أجـره إلـى مسـلم.",count:1},
{text:"اللهـم أسـلمت نفـسي إلـيك، وفوضـت أمـري إلـيك، ووجـهت وجـهي إلـيك، وألـجـات ظهـري إلـيك، رغبـة ورهـبة إلـيك، لا ملجـأ ولا منـجـا منـك إلا إلـيك، آمنـت بكتـابك الـذي أنزلـت وبنبـيـك الـذي أرسلـت.",count:1},
{text:"سبحان الله.",count:33},{text:"الحمد لله.",count:33},{text:"الله أكبر.",count:34},
{text:"يجمع كفيه ثم ينفث فيهما والقراءة فيهما: {قل هو الله أحد} و{قل أعوذ برب الفلق} و{قل أعوذ برب الناس} ومسح ما استطاع من الجسد يبدأ بهما على رأسه ووجه وما أقبل من جسده.",count:3},
{text:"سورة البقرة: أعوذ بالله من الشيطان الرجيم\nآمن الرسول بما أنزل إليه من ربه والمؤمنون ۚ كل آمن بالله وملائكته وكتبه ورسله لا نفرق بين أحد من رسله ۚ وقالوا سمعنا وأطعنا ۖ غفرانك ربنا وإليك المصير. لا يكلف الله نفسا إلا وسعها لها ما كسبت وعليها ما اكتسبت ربنا لا تؤاخذنا إن نسينا أو أخطأنا ربنا ولا تحمل علينا إصرا كما حملته على الذين من قبلنا ربنا ولا تحملنا ما لا طاقة لنا به واعف عنا واغفر لنا وارحمنا أنت مولانا فانصرنا على القوم الكافرين. [البقرة 285 - 286]\n\nمن قرأ آيتين من آخر سورة البقرة في ليلة كفتاه.",count:1},
{text:"آية الكرسى: أعوذ بالله من الشيطان الرجيم\nالله لا إلـه إلا هو الحي القيوم لا تأخذه سنة ولا نوم له ما في السماوات وما في الأرض من ذا الذي يشفع عنده إلا بإذنه يعلم ما بين أيديهم وما خلفهم ولا يحيطون بشيء من علمه إلا بما شاء وسع كرسيه السماوات والأرض ولا يؤوده حفظهما وهو العلي العظيم. [البقرة 255]",count:1},
{text:"أذكار من قلق في فراشه ولم ينم:\nعن بريدة رضي الله عنه، قال: شكا خالد بن الوليد رضي الله عنه إلى النبي صلى الله عليه وسلم فقال: يا رسول الله! ما أنام الليل من الأرق، فقال النبي صلى الله عليه وسلم: إذا أويت إلى فراشك فقل: اللهم رب السموات السبع وما أظلت، ورب الأرضين وما أقلت، ورب الشياطين وما أضلت، كن لي جارا من خلقك كلهم جميعا أن يفرط علي أحد منهم أو أن يبغي علي، عز جارك، وجل ثناؤك ولا إله غيرك، ولا إله إلا أنت.\n\nوعن عمرو بن شعيب، عن أبيه، عن جده: أن رسول الله صلى الله عليه وسلم كان يعلمهم من الفزع كلمات: أعوذ بكلمات الله التامة من غضبه وشر عباده، ومن همزات الشياطين وأن يحضرون.",count:1},
{text:"أذكار الأحلام:\nعن أبي قتادة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: الرؤيا الصالحة من الله، والحلم من الشيطان، فمن رأى شيئا يكرهُه فلينفث عن شماله ثلاثا وليتعوذ من الشيطان، فإنها لا تضره.",count:1}
];
const state=adhkar.map(()=>0);
function clickSound(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=520;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.045)}catch(e){}}
function render(){const box=document.getElementById('cards');box.innerHTML='';adhkar.forEach((item,i)=>{const done=state[i]>=item.count,card=document.createElement('section');card.className='card';card.innerHTML=`<h2><span class="num">${i+1}</span> ذكر رقم ${i+1}</h2><div class="text">${item.text}</div><div class="count"><div class="counter">${done?'تم ✓':state[i]+' / '+item.count}</div><button class="zikr-btn" ${done?'disabled':''}>${done?'تم ✓':'اضغط للذكر'}</button></div>`;card.querySelector('.zikr-btn').onclick=()=>{if(state[i]<item.count){state[i]++;clickSound();render()}};box.appendChild(card)})}
function resetAll(){state.fill(0);render()}render();
</script>
</body>
</html>

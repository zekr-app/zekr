<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أذكار النوم — ذِكر</title>
<style>
:root{--bg:#f7f1e5;--card:#fffdf8;--g:#159b86;--gd:#087967;--gs:#dff4ed;--t:#193b35;--m:#6f817c;--b:#e5e0d4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,Arial,sans-serif;line-height:2}
header{position:sticky;top:0;z-index:5;background:#fffdf8ee;border-bottom:1px solid var(--b)}
nav{max-width:1050px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-size:22px;font-weight:800;color:var(--gd);text-decoration:none}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{color:var(--t);text-decoration:none;padding:5px 9px;border-radius:10px;font-size:14px}.links a:hover{background:var(--gs)}
main{max-width:900px;margin:auto;padding:28px 14px 60px}.hero{text-align:center}.hero h1{margin:0;color:var(--gd);font-size:32px}.hero p{color:var(--m);margin:0 0 20px}.actions{text-align:center;margin:18px}.reset{border:0;background:var(--g);color:white;border-radius:14px;padding:11px 18px;font-weight:bold;font-size:15px}.card{background:var(--card);border:1px solid var(--b);border-radius:22px;margin:14px 0;padding:20px;box-shadow:0 8px 24px #1f534814}.card.done{border-color:#8dd7c5}.num{display:inline-block;background:var(--gs);color:var(--gd);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:bold}.text{font-size:21px;font-weight:600;line-height:2.25;margin-top:8px}.row{display:flex;gap:12px;align-items:center;margin-top:18px}.btn{border:0;width:100%;min-height:60px;border-radius:17px;background:var(--g);color:white;font-size:19px;font-weight:bold}.btn.done{background:var(--gd)}.count{min-width:95px;text-align:center;color:var(--gd);font-weight:bold;font-size:18px}.current{font-size:25px}.foot{text-align:center;color:var(--m);margin-top:35px;font-size:13px}
@media(max-width:650px){nav{flex-direction:column;align-items:flex-start}.links{width:100%;justify-content:center}.hero h1{font-size:27px}.card{padding:16px}.text{font-size:18px}}
</style></head>
<body>
<header><nav><a class="brand" href="index.html">ذِكر</a><div class="links"><a href="index.html">الرئيسية</a><a href="morning.html">أذكار الصباح</a><a href="evening.html">أذكار المساء</a><a href="sleep.html">أذكار النوم</a></div></nav></header>
<main><section class="hero"><h1>أذكار النوم والأحلام</h1><p>13 ذكرًا كما في نفس المصدر</p></section><div class="actions"><button class="reset" id="reset">↻ إعادة جميع العدادات</button></div><section id="list"></section><div class="foot">ذِكر — اذكر الله في كل وقت.</div></main>
<script>
const adhkar=[('بِاسْمِكَ رَبِّـي وَضَعْـتُ جَنْـبي، وَبِكَ أَرْفَعُـه، فَإِن أَمْسَـكْتَ نَفْسـي فارْحَـمْها، وَإِنْ أَرْسَلْتَـها فاحْفَظْـها بِمـا تَحْفَـظُ بِه عِبـادَكَ الصّـالِحـين.', 1), ('اللّهُـمَّ إِنَّـكَ خَلَـقْتَ نَفْسـي وَأَنْـتَ تَوَفّـاهـا لَكَ ممَـاتـها وَمَحْـياها، إِنْ أَحْيَيْـتَها فاحْفَظْـها، وَإِنْ أَمَتَّـها فَاغْفِـرْ لَـها. اللّهُـمَّ إِنِّـي أَسْـأَلُـكَ العـافِـيَة.', 1), ('اللّهُـمَّ قِنـي عَذابَـكَ يَـوْمَ تَبْـعَثُ عِبـادَك.', 3), ('بِاسْـمِكَ اللّهُـمَّ أَمـوتُ وَأَحْـيا.', 1), ('الـحَمْدُ للهِ الَّذي أَطْـعَمَنا وَسَقـانا، وَكَفـانا، وَآوانا، فَكَـمْ مِمَّـنْ لا كـافِيَ لَـهُ وَلا مُـؤْوي.', 1), ('اللّهُـمَّ عالِـمَ الغَـيبِ وَالشّـهادةِ فاطِـرَ السّماواتِ وَالأرْضِ رَبَّ كُـلِّ شَـيءٍ وَمَليـكَه، أَشْهـدُ أَنْ لا إِلـهَ إِلاّ أَنْت، أَعـوذُ بِكَ مِن شَـرِّ نَفْسـي، وَمِن شَـرِّ الشَّيـطانِ وَشِـرْكِه، وَأَنْ أَقْتَـرِفَ عَلـى نَفْسـي سوءاً أَوْ أَجُـرَّهُ إِلـى مُسْـلِم.', 1), ('اللّهُـمَّ أَسْـلَمْتُ نَفْـسي إِلَـيْكَ، وَفَوَّضْـتُ أَمْـري إِلَـيْكَ، وَوَجَّهْـتُ وَجْـهي إِلَـيْكَ، وَأَلْـجَـأْتُ ظَهـري إِلَـيْكَ، رَغْبَـةً وَرَهْـبَةً إِلَـيْكَ، لا مَلْجَـأَ وَلا مَنْـجـا مِنْـكَ إِلاّ إِلَـيْكَ، آمَنْـتُ بِكِتـابِكَ الّـذي أَنْزَلْـتَ وَبِنَبِـيِّـكَ الّـذي أَرْسَلْـت.', 1), ('سُبْحَانَ اللَّهِ.', 33), ('الْحَمْدُ لِلَّهِ.', 33), ('اللَّهُ أَكْبَرُ.', 34), ('يجمع كفيه ثم ينفث فيهما، ويقرأ: قل هو الله أحد، وقل أعوذ برب الفلق، وقل أعوذ برب الناس، ثم يمسح ما استطاع من الجسد، يبدأ بهما على رأسه ووجهه وما أقبل من جسده.', 3), ('أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ. آمن الرسول بما أنزل إليه من ربه والمؤمنون، كل آمن بالله وملائكته وكتبه ورسله لا نفرق بين أحد من رسله، وقالوا سمعنا وأطعنا غفرانك ربنا وإليك المصير. لا يكلف الله نفسًا إلا وسعها لها ما كسبت وعليها ما اكتسبت ربنا لا تؤاخذنا إن نسينا أو أخطأنا ربنا ولا تحمل علينا إصرًا كما حملته على الذين من قبلنا ربنا ولا تحملنا ما لا طاقة لنا به واعف عنا واغفر لنا وارحمنا أنت مولانا فانصرنا على القوم الكافرين.', 1), ('أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ. اللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ.', 1)];const list=document.getElementById('list'),reset=document.getElementById('reset'),p=Array(adhkar.length).fill(0);let ac=null;
function sound(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!ac)ac=new A;if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=620;g.gain.setValueAtTime(.035,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.07);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.07)}catch(e){}}
function render(){list.innerHTML='';adhkar.forEach((x,i)=>{const done=p[i]>=x[1],c=document.createElement('article');c.className='card'+(done?' done':'');c.innerHTML='<div class="num">الذكر '+(i+1)+'</div><div class="text">'+x[0]+'</div><div class="row"><button class="btn '+(done?'done':'')+'">'+(done?'✓ تم الذكر':'اضغط للتكرار')+'</button><div class="count"><span class="current">'+(done?'✓':p[i])+'</span> / '+x[1]+'</div></div>';c.querySelector('.btn').onclick=()=>{if(p[i]>=x[1])return;sound();p[i]++;render()};list.appendChild(c)})}
reset.onclick=()=>{p.fill(0);render();scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
